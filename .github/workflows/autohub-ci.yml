name: autohub CI

on:
  push:
    paths: ["autohub/**", ".github/workflows/autohub-ci.yml"]
  pull_request:
    paths: ["autohub/**", ".github/workflows/autohub-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autohub/backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: autohub
          POSTGRES_PASSWORD: autohub
          POSTGRES_DB: autohub
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U autohub" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: autohub/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Creates and resets its own autohub_e2e database on the service container.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://autohub:autohub@localhost:55433/autohub_e2e?sslmode=disable

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autohub/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos are non-fatal: Flutter 3.47+ marks package:flutter/material.dart deprecated (see docs).
      - run: flutter analyze --no-fatal-infos packages/autohub_core apps/customer_app apps/vendor_app
      - run: cd packages/autohub_core && flutter test
      - run: cd apps/customer_app && flutter test
      - run: cd apps/vendor_app && flutter test
