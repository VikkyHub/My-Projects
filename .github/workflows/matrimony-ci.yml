name: matrimony-app CI

on:
  push:
    paths: ["matrimony-app/**", ".github/workflows/matrimony-ci.yml"]
  pull_request:
    paths: ["matrimony-app/**", ".github/workflows/matrimony-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matrimony-app/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matri
          POSTGRES_PASSWORD: matri
          POSTGRES_DB: matrimony_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U matri" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matrimony-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matrimony-app/web/package-lock.json
      - run: npm ci
      - run: npm run build
